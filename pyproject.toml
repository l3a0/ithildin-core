[project]
name = "ithildincore"
version = "0.2.0"
description = "Estimators shared by more than one of l3a0's quantitative repositories."
readme = "README.md"
requires-python = ">=3.12"
# Two runtime dependencies, and the second is the reason the first is listed
# explicitly rather than left to transitive resolution. statsmodels supplies
# the OLS and ADF implementations this package wraps, and it pulls numpy in
# anyway, but ithildincore.stats uses numpy directly and declares what it uses.
dependencies = [
    "numpy>=2",
    "statsmodels>=0.14",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ithildincore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Puts the repo root on the path, so a test can import both the package under
# src/ and the helpers under tests/support/.
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
